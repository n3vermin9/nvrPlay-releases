name: Release NvrPllst for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out Windows shell
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag"
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate shell
        run: npm run check

      - name: Build and publish update
        run: npm run publish:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
